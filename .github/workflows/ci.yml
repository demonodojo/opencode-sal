name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: opencode-sal

      - uses: actions/checkout@v4
        with:
          repository: demonodojo/soso
          path: soso

      - name: Pin Sal (config/sal-source.lock de soso)
        id: sal_pin
        run: |
          BASE=$(grep '^base=' soso/config/sal-source.lock | cut -d= -f2)
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: demonodojo/sal
          ref: ${{ steps.sal_pin.outputs.ref }}
          path: sal

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sincronizar sal-source.lock con el checkout Sal
        run: SOSO_SAL_SOURCE="${{ github.workspace }}/sal" python3 soso/scripts/sal-source.py --update

      - name: Build y pruebas
        working-directory: opencode-sal
        env:
          SAL_ROOT: ${{ github.workspace }}/sal
          SOSO_ROOT: ${{ github.workspace }}/soso
        run: |
          chmod +x scripts/*.sh build.sh tests/*.sh
          ./scripts/release-build.sh
          ./tests/probar_http.sh
          ./tests/probar_tui.sh
